# 사내 DB 패키지 카탈로그
#
# 패키지 규칙 (구현된 패키지 기준):
#   - 이름   : 벤더 이름 그대로 (사내 접두어 없음). 예) mysql, mongodb, mongosh, datadog-agent
#   - 버전   : Epoch 2, Release = N.DBA (예: mysql-2:8.4.13-1.DBA). 새 버전은 Release 1부터.
#   - 경로   : /opt/<이름> 에 설치, 실행 파일은 /usr/local/bin 링크 (alternatives 미사용)
#   - 설정   : /etc/<이름>/ (noreplace), 데이터: /data/<이름>/
#   - 저장소 : 메이저 버전을 포함한 폴더 이름 = 저장소 ID (mysql84, mongodb90 ...),
#              빌드 결과는 dist/<os>/<저장소 ID>. 대상 OS 기본값 al2023 (el9 도 가능).
#   - 한 서버에는 제품당 하나의 메이저/버전만 설치 (메이저가 달라도 패키지 이름은 같음).
#
# 필드:
#   package     : RPM 이름
#   repo        : 저장소 ID = spec 폴더 이름 (미착수는 예정 이름)
#   status      : done(spec·테스트 있음) / todo(미착수)
#   source_type :
#     tarball : 벤더가 미리 빌드한 바이너리 묶음 → 풀어서 /opt/<이름> 아래 배치
#     rpm     : 벤더 공식 RPM 을 Source0 으로 받아 사내 규칙(Epoch/Release)으로 재패키징
#     source  : 소스만 제공 → 대상 OS 컨테이너에서 직접 빌드
#     go-bin  : 단일 정적 바이너리 → 단순 패키징
#     perl    : 스크립트 묶음 → 런타임 의존성(OS perl 모듈) 선언 필요
#     python  : pip 배포 → /opt/<이름> 에 venv 통째로 패키징
#     msi     : Windows 공식 MSI 를 서명 검증 후 그대로 배포 (windows/<폴더>/fetch-msi.ps1)
#
# 주의: 파일명 규칙과 제공 여부는 벤더가 바꿀 수 있으므로 새 버전마다 다운로드 페이지에서 확인할 것.

mysql:
  - { package: mysql,                repo: mysql84,    status: done, source_type: tarball, vendor: Oracle,  page: https://dev.mysql.com/downloads/mysql/,
      verify: "MD5(다운로드 페이지) + GPG(.asc)", notes: "8.4 LTS. 전체(non-minimal) glibc2.28 tarball, 디버그 바이너리 제외, lib/private 번들 라이브러리는 Requires 제외. X.Y.Z.1 긴급 수정 릴리스 있음(8.4.13.1)" }
  - { package: mysql,                repo: mysql97,    status: done, source_type: tarball, vendor: Oracle,  page: https://dev.mysql.com/downloads/mysql/,
      verify: "MD5 + GPG", notes: "9.7 LTS. mysql84 와 같은 구성 (9.7.4.1 같은 긴급 수정 릴리스 있음)" }
  - { package: mysql,                repo: mysql2610,  status: done, source_type: tarball, vendor: Oracle,  page: https://dev.mysql.com/downloads/mysql/,
      verify: "MD5 + GPG", notes: "9.7 이후 연.월 버전 체계(26.7, 26.10). 26.0 은 없음" }
  - { package: mysql-shell,          repo: mysqlsh84,  status: todo, source_type: tarball, vendor: Oracle,  page: https://dev.mysql.com/downloads/shell/,
      verify: "MD5 + GPG", notes: "번들 Python 포함, AutoReq 필터 필수" }
  - { package: mysql-router,         repo: mysql-router84, status: todo, source_type: tarball, vendor: Oracle, page: https://dev.mysql.com/downloads/router/,
      verify: "MD5 + GPG", notes: "InnoDB Cluster/ReplicaSet 사용 시" }
  - { package: gh-ost,               repo: gh-ost,     status: todo, source_type: go-bin,  vendor: GitHub,  page: https://github.com/github/gh-ost/releases,
      verify: "릴리스 체크섬", notes: "" }

percona:
  - { package: percona-server,       repo: ps84,       status: todo, source_type: tarball, vendor: Percona, page: https://www.percona.com/downloads,
      verify: "sha256", notes: "Percona Server for MySQL, glibc 버전별 tarball 중 대상 OS 이하 선택. mysql 패키지와 같은 서버에 설치 불가(Conflicts 필요)" }
  - { package: percona-xtrabackup,   repo: pxb84,      status: todo, source_type: tarball, vendor: Percona, page: https://www.percona.com/downloads,
      verify: "sha256", notes: "MySQL 메이저와 반드시 일치 (8.0↔pxb80, 8.4↔pxb84)" }
  - { package: percona-toolkit,      repo: percona-toolkit, status: todo, source_type: perl, vendor: Percona, page: https://www.percona.com/downloads,
      verify: "sha256", notes: "Requires: perl-DBI, perl-DBD-MySQL, perl-Time-HiRes 등 OS 패키지" }
  - { package: pmm-client,           repo: pmm3-client, status: todo, source_type: tarball, vendor: Percona, page: https://www.percona.com/downloads,
      verify: "sha256", notes: "PMM Server는 컨테이너 이미지이므로 ECR로 관리" }
  - { package: percona-server-mongodb, repo: psmdb80, status: todo, source_type: tarball, vendor: Percona, page: https://www.percona.com/downloads,
      verify: "sha256", notes: "Percona Server for MongoDB, OS별 빌드. mongodb 패키지와 같은 서버에 설치 불가(Conflicts 필요)" }
  - { package: percona-backup-mongodb, repo: pbm,     status: todo, source_type: tarball, vendor: Percona, page: https://www.percona.com/downloads,
      verify: "sha256", notes: "PBM, PSMDB/MongoDB 버전 호환표 확인" }

mongodb:
  - { package: mongodb,              repo: mongodb83,  status: done, source_type: tarball, vendor: MongoDB, page: https://www.mongodb.com/try/download/community,
      verify: "sha256(.sha256 파일)", notes: "generic 빌드 없음: OS별 tarball(amazon2023 / rhel93). mongod·mongos 만 포함(mongosh 별도), authorization enabled" }
  - { package: mongodb,              repo: mongodb90,  status: done, source_type: tarball, vendor: MongoDB, page: https://www.mongodb.com/try/download/community,
      verify: "sha256(.sha256 파일)", notes: "mongodb83 과 같은 구성. 업그레이드 테스트에서 FCV 확인" }
  - { package: mongosh,              repo: mongosh2,   status: done, source_type: tarball, vendor: MongoDB, page: https://www.mongodb.com/try/download/shell,
      verify: "sha256", notes: "linux-x64-openssl3 공용 tarball (OS 구분 없음)" }
  - { package: mongodb-tools,        repo: mongodb-tools100, status: done, source_type: tarball, vendor: MongoDB, page: https://www.mongodb.com/try/download/database-tools,
      verify: "sha256", notes: "mongodump/mongorestore 등, OS별 tarball(amazon2023 / rhel93). 버전 중간 자리가 바뀌므로 GitHub 태그로 버전 목록 조회" }
  - { package: mongodbtop,           repo: mongodbtop0, status: done, source_type: source, vendor: bylee5, page: https://github.com/bylee5/mongodbtop/releases,
      verify: "휠 sha256(spec 고정)", notes: "Python TUI 모니터. 시스템 python3(3.9) 사용, pymongo 4.18.3·dnspython 2.7.0 휠 동봉. 설정 /etc/mongodbtop/mongodbtop.ini (~/.mongodbtop.ini 우선)" }
  - { package: mongodb-exporter,     repo: mongodb-exporter, status: todo, source_type: go-bin, vendor: Percona, page: https://github.com/percona/mongodb_exporter/releases,
      verify: "릴리스 체크섬", notes: "" }

postgresql:
  - { package: postgresql,           repo: postgresql17, status: todo, source_type: source, vendor: PGDG,  page: https://www.postgresql.org/ftp/source/,
      verify: "sha256(.sha256 파일)", notes: "Linux용 공식 바이너리 tarball 없음 → 소스 빌드가 표준" }
  - { package: pgaudit,              repo: postgresql17, status: todo, source_type: source, vendor: pgaudit, page: https://github.com/pgaudit/pgaudit/releases,
      verify: "태그 + sha256 기록", notes: "PG 메이저마다 별도 빌드 (USE_PGXS=1, pg_config 경로 지정). PG 저장소에 함께 배포" }
  - { package: pg_repack,            repo: postgresql17, status: todo, source_type: source, vendor: reorg, page: https://github.com/reorg/pg_repack/releases,
      verify: "태그 + sha256 기록", notes: "확장 모듈, PG 메이저마다 별도 빌드. PG 저장소에 함께 배포" }
  - { package: pgbouncer,            repo: pgbouncer,  status: todo, source_type: source,  vendor: pgbouncer, page: https://www.pgbouncer.org/downloads/,
      verify: "sha256", notes: "libevent-devel, openssl-devel 필요" }
  - { package: pgbackrest,           repo: pgbackrest, status: todo, source_type: source,  vendor: pgbackrest, page: https://github.com/pgbackrest/pgbackrest/releases,
      verify: "태그 + sha256 기록", notes: "버전에 따라 빌드 시스템이 다르므로 릴리스 노트 확인" }
  - { package: patroni,              repo: patroni,    status: todo, source_type: python,  vendor: Zalando, page: https://pypi.org/project/patroni/,
      verify: "pip --require-hashes", notes: "대상 OS 컨테이너 안에서 /opt/patroni 경로에 venv 생성 후 통째로 패키징" }
  - { package: pgbadger,             repo: pgbadger,   status: todo, source_type: perl,    vendor: darold,  page: https://github.com/darold/pgbadger/releases,
      verify: "태그 + sha256 기록", notes: "" }
  - { package: postgresqltop,        repo: postgresqltop0, status: done, source_type: source, vendor: bylee5, page: https://github.com/bylee5/postgresqltop/releases,
      verify: "휠 sha256(spec 고정)", notes: "Python TUI 모니터. 시스템 python3(3.9), psycopg 3.2.13(binary, libpq 포함)·typing_extensions 4.16.0 휠 동봉 → OS libpq 불필요. 설정 /etc/postgresqltop/postgresqltop.ini (~/.postgresqltop.ini 우선)" }
  - { package: postgres-exporter,    repo: postgres-exporter, status: todo, source_type: go-bin, vendor: prometheus-community, page: https://github.com/prometheus-community/postgres_exporter/releases,
      verify: "릴리스 체크섬", notes: "" }

mssql:
  - { package: mssqltop,             repo: mssqltop0, status: done, source_type: source, vendor: bylee5, page: https://github.com/bylee5/mssqltop/releases,
      verify: "휠 sha256(spec 고정)", notes: "SQL Server Python TUI 모니터. 시스템 python3(3.9), pyodbc 5.3.0 휠 동봉, Requires unixODBC, Recommends msodbcsql18(Microsoft 저장소, 서버에서 별도 설치). 설정 /etc/mssqltop/mssqltop.ini" }

monitoring:
  - { package: datadog-agent,        repo: datadog-agent7, status: done, source_type: rpm, vendor: Datadog, page: https://yum.datadoghq.com/stable/7/x86_64/,
      verify: "벤더 RPM GPG 서명 (rpm -K, 현재 빌드에서 자동 검증 안 함)", notes: "공식 RPM 의 파일·권한·스크립트를 그대로 옮기고 Epoch 2·N.DBA 만 변경. 이름은 벤더 installer 의존 때문에 유지. datadog.yaml(API 키)은 패키지에 넣지 않음" }
  - { package: datadog-agent,        repo: windows/datadog-agent7, status: done, source_type: msi, vendor: Datadog, page: https://s3.amazonaws.com/ddagent-windows-stable/installers_v2.json,
      verify: "Authenticode 서명 + MSI 제품 정보", notes: "Windows 용. MSI 는 수정하지 않고 이름만 정리(datadog-agent-<버전>-x86_64.msi), SHA256SUMS·LATEST 생성 → dist/windows/datadog-agent7" }
