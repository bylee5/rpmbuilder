; =============================================================================
; /etc/mssqltop/mssqltop.ini : mssqltop 서버 목록 (mssqltop 패키지가 설치)
;
; - 이 파일을 수정해도 패키지 업데이트 시 덮어쓰지 않습니다.
; - 이 서버의 모든 사용자가 함께 씁니다. 사용자별 설정은 ~/.mssqltop.ini (있으면 이 파일 대신 사용).
;   우선순위: --config > 환경변수 MSSQLTOP_CONFIG > ~/.mssqltop.ini > 이 파일
; - 비밀번호는 이 파일에 쓰지 않습니다 (password 키가 있으면 오류).
;   MSSQLTOP_PASSWORD_<NAME> 환경변수, password_env, MSSQL_PASSWORD, 또는 실행 시 입력으로 넘깁니다.
; - SQL Server ODBC 드라이버(msodbcsql18, Microsoft 저장소)가 필요합니다.
; - 확인: mssqltop --list
; - 전체 예시: /opt/mssqltop/mssqltop.ini.example
; =============================================================================

;[defaults]
;interval = 2
;user = monitor            ; 모든 서버의 기본 SQL 로그인 (VIEW SERVER STATE 필요)
;trust_cert = yes          ; 자체 서명 인증서 허용 (ODBC Driver 18은 기본으로 암호화)
;default = prod            ; 인자 없이 실행했을 때 접속할 서버 또는 그룹

;[server:prod-ag]
;server = sql-listener,1433
;groups = prod
;expand = replicas         ; 가용성 그룹 복제본마다 따로 모니터링
;options = MultiSubnetFailover=Yes
