# =============================================================================
# /etc/mongodb/mongod.conf : MongoDB 서버 기본 설정 (mongodb 패키지가 설치)
#
# - 이 파일을 수정해도 패키지 업데이트 시 덮어쓰지 않습니다.
#   새 기본값은 /etc/mongodb/mongod.conf.rpmnew 로 저장되니 비교 후 반영하세요.
# - 서버: systemctl enable --now mongod   (데이터 파일은 첫 기동 시 자동 생성)
# - 인증이 켜져 있습니다. 첫 관리자 계정은 서버 안에서 mongosh 로 만듭니다:
#     use admin
#     db.createUser({user: "admin", pwd: passwordPrompt(), roles: ["root"]})
# - YAML 형식: 들여쓰기는 공백 2칸 (탭 사용 금지)
# =============================================================================

storage:
  dbPath: /data/mongodb/data
  # 캐시 메모리 (기본: (물리 메모리 - 1GB) 의 50%). 다른 프로그램과 같이 쓰는 서버면 지정
  #wiredTiger:
  #  engineConfig:
  #    cacheSizeGB: 4

systemLog:
  destination: file
  path: /data/mongodb/logs/mongod.log
  logAppend: true

net:
  port: 27017
  # 기본은 서버 안에서만 접속 가능. 다른 서버에서 접속하려면 서버 IP 를 추가하세요.
  #   예: bindIp: 127.0.0.1,10.0.0.11
  bindIp: 127.0.0.1
  unixDomainSocket:
    pathPrefix: /data/mongodb

security:
  authorization: enabled
  # 복제 구성 시: 멤버 간 인증 키 (mongodb 소유, 권한 400)
  #keyFile: /etc/mongodb/keyfile

# --- 복제 구성 시 (모든 멤버에 같은 이름) ---
#replication:
#  replSetName: rs0
