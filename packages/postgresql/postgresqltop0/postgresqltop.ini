; =============================================================================
; /etc/postgresqltop/postgresqltop.ini : postgresqltop 서버 목록 (postgresqltop 패키지가 설치)
;
; - 이 파일을 수정해도 패키지 업데이트 시 덮어쓰지 않습니다.
; - 이 서버의 모든 사용자가 함께 씁니다. 사용자별 설정은 ~/.postgresqltop.ini (있으면 이 파일 대신 사용).
;   우선순위: --config > 환경변수 POSTGRESQLTOP_CONFIG > ~/.postgresqltop.ini > 이 파일
; - 비밀번호는 이 파일에 쓰지 않습니다 (password 키가 있으면 오류).
;   POSTGRESQLTOP_PASSWORD_<NAME> 환경변수, password_env, PGPASSWORD, ~/.pgpass, 또는 실행 시 입력으로 넘깁니다.
; - 확인: postgresqltop --list
; - 전체 예시: /opt/postgresqltop/postgresqltop.ini.example
; =============================================================================

;[defaults]
;interval = 2
;user = monitor            ; 모든 서버의 기본 사용자 (pg_monitor 역할 권장)
;dbname = postgres
;sslmode = prefer
;default = prod            ; 인자 없이 실행했을 때 접속할 서버 또는 그룹

;[server:prod-primary]
;server = pg-primary:5432
;groups = prod
;expand = replicas         ; 붙어 있는 스트리밍 스탠바이마다 따로 모니터링
