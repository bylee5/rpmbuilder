# =============================================================================
# /etc/postgresql/postgresql.conf : PostgreSQL 서버 기본 설정 (postgresql 패키지가 설치)
#
# - 이 파일을 수정해도 패키지 업데이트 시 덮어쓰지 않습니다.
#   새 기본값은 /etc/postgresql/postgresql.conf.rpmnew 로 저장되니 비교 후 반영하세요.
# - 서버별 추가 설정은 /etc/postgresql/conf.d/*.conf 에 두어도 됩니다 (이 파일 뒤에 적용).
# - 서버: systemctl enable --now postgresql   (첫 기동 시 data_directory 에 자동 initdb)
# - 접속: sudo -u postgres psql
# - 데이터 디렉터리 안의 postgresql.conf / pg_hba.conf 는 사용하지 않습니다.
# =============================================================================

# --- 경로 ---
data_directory              = '/data/postgresql/data'
hba_file                    = '/etc/postgresql/pg_hba.conf'
ident_file                  = '/etc/postgresql/pg_ident.conf'
hosts_file                  = '/etc/postgresql/pg_hosts.conf'   # PostgreSQL 19: SSL SNI 호스트별 인증서

# --- 접속 ---
# 기본은 서버 안에서만 접속 가능. 다른 서버에서 접속하려면 '*' 또는 서버 IP 로 바꾸고 pg_hba.conf 에 허용 대역 추가
listen_addresses            = 'localhost'
port                        = 5432
max_connections             = 200
password_encryption         = scram-sha-256

# --- 메모리 (서버 사양에 맞게 조정) ---
# shared_buffers: 보통 물리 메모리의 25%
shared_buffers              = 128MB
#effective_cache_size       = 4GB
#work_mem                   = 4MB
#maintenance_work_mem       = 64MB

# --- 확장 ---
shared_preload_libraries    = 'pg_stat_statements'

# --- 로그 ---
logging_collector           = on
log_directory               = '/data/postgresql/logs'
log_filename                = 'postgresql-%a.log'
log_truncate_on_rotation    = on
log_rotation_age            = 1d
log_rotation_size           = 0
log_line_prefix             = '%m [%p] %q%u@%d '
log_min_duration_statement  = 1000
log_checkpoints             = on
log_lock_waits              = on

# --- 지역 설정 ---
timezone                    = 'Asia/Seoul'
log_timezone                = 'Asia/Seoul'
lc_messages                 = 'C.UTF-8'
datestyle                   = 'iso, mdy'
default_text_search_config  = 'pg_catalog.english'

# --- 서버별 추가 설정 ---
include_dir                 = 'conf.d'
