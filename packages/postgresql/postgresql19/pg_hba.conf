# =============================================================================
# /etc/postgresql/pg_hba.conf : 접속 허용 규칙 (위에서부터 처음 일치하는 줄 적용)
#   수정 후 반영: systemctl reload postgresql
#
# - local(소켓) 접속은 OS 계정 이름으로 인증 (peer): sudo -u postgres psql
# - TCP 접속은 비밀번호(scram-sha-256)
# - 다른 서버에서 접속을 허용하려면 아래에 대역을 추가하고 postgresql.conf 의 listen_addresses 도 변경
#     host    all    all    10.0.0.0/8    scram-sha-256
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     peer
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
