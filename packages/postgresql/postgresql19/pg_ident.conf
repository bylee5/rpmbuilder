# =============================================================================
# /etc/postgresql/pg_ident.conf : OS 계정 ↔ DB 계정 매핑 (peer/ident 인증에서 map= 으로 사용)
#   예) OS 계정 dba 가 DB 계정 postgres 로 접속:
#       pg_hba.conf : local all postgres peer map=dba
#       아래        : dba   dba   postgres
# =============================================================================

# MAPNAME       SYSTEM-USERNAME         PG-USERNAME
