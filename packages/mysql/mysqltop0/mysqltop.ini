; =============================================================================
; /etc/mysqltop/mysqltop.ini : mysqltop 서버 목록 (mysqltop 패키지가 설치)
;
; - 이 파일을 수정해도 패키지 업데이트 시 덮어쓰지 않습니다.
; - 이 서버의 모든 사용자가 함께 씁니다. 사용자별 설정은 ~/.mysqltop.ini (있으면 이 파일 대신 사용).
;   우선순위: --config > 환경변수 MYSQLTOP_CONFIG > ~/.mysqltop.ini > 이 파일
; - 비밀번호는 이 파일에 쓰지 않습니다 (password 키가 있으면 오류).
;   MYSQLTOP_PASSWORD_<NAME> 환경변수, password_env, MYSQL_PWD, ~/.my.cnf 의 [client], 또는 실행 시 입력으로 넘깁니다.
; - 확인: mysqltop --list
; - 전체 예시: /opt/mysqltop/mysqltop.ini.example
; =============================================================================

;[defaults]
;interval = 2
;user = monitor            ; 모든 서버의 기본 사용자 (PROCESS, REPLICATION CLIENT, performance_schema SELECT)
;ssl_mode = REQUIRED       ; DISABLED / PREFERRED(기본) / REQUIRED / VERIFY_CA / VERIFY_IDENTITY
;default = prod            ; 인자 없이 실행했을 때 접속할 서버 또는 그룹

;[server:prod-db1]
;server = db1:3306
;groups = prod
;expand = yes              ; Group Replication 멤버 / 복제본도 함께 모니터링

;[server:local]
;server = root@/data/mysql/tmp/mysql.sock
